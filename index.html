<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五行能量測試系統</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --surface2: #f4f2ee;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --text2: #5a5a5a;
    --text3: #999;
    --radius: 12px;
    --radius-sm: 8px;
    --accent: #7c3aed;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --surface: #1e1e1e;
      --surface2: #282828;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --text: #f0f0f0;
      --text2: #aaa;
      --text3: #666;
    }
  }

  body {
    font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem 3rem;
  }

  .app {
    width: 100%;
    max-width: 600px;
  }

  .site-header {
    text-align: center;
    padding: 1rem 0 0.5rem;
    margin-bottom: 1.5rem;
  }
  .site-header .brand {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }

  .phase { display: none; }
  .phase.active { display: block; }

  /* Welcome */
  .hero { text-align: center; padding: 2rem 1rem 1.5rem; }
  .hero-symbol { margin: 0 auto 1.5rem; display: flex; justify-content: center; }
  .hero h1 { font-size: 30px; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
  .hero p { font-size: 14px; color: var(--text2); line-height: 1.7; max-width: 380px; margin: 0 auto; }
  .hero-stats { display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0; }
  .stat { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 600; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* Progress */
  .progress-wrap { margin-bottom: 1.25rem; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text3); margin-bottom: 6px; }
  .progress-bar { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #ec4899); border-radius: 2px; transition: width 0.4s ease; }

  /* Question card */
  .q-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
  .q-text { font-size: 16px; font-weight: 500; line-height: 1.55; margin-bottom: 1.25rem; }
  .q-options { display: grid; gap: 8px; }
  .q-opt {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.7rem 1rem;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    line-height: 1.45;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .q-opt:hover { border-color: var(--border2); background: var(--surface); }
  .q-opt.selected { border-color: #7c3aed; background: #f5f3ff; color: #4c1d95; }
  @media (prefers-color-scheme: dark) {
    .q-opt.selected { background: #2e1f5e; color: #c4b5fd; border-color: #7c3aed; }
  }
  .q-opt .el-badge { font-size: 11px; padding: 2px 7px; border-radius: 20px; background: var(--surface); border: 0.5px solid var(--border); color: var(--text2); white-space: nowrap; flex-shrink: 0; }

  .nav-row { display: flex; gap: 8px; margin-top: 0.25rem; }

  /* Buttons */
  .btn {
    border-radius: var(--radius-sm);
    padding: 0.65rem 1.5rem;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
  }
  .btn-primary { background: var(--text); color: var(--bg); display: block; width: 100%; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-outline { background: transparent; color: var(--text2); border: 0.5px solid var(--border); }
  .btn-outline:hover { background: var(--surface2); }
  .btn-next { flex: 1; }

  /* Results */
  .result-hero { text-align: center; padding: 1.5rem 0 1rem; }
  .result-icon { font-size: 52px; display: block; margin-bottom: 0.5rem; }
  .result-name { font-size: 24px; font-weight: 600; margin-bottom: 0.25rem; }
  .result-sub { font-size: 13px; color: var(--text2); }

  .scores-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 1.25rem 0; }
  .score-cell { text-align: center; padding: 0.65rem 0.2rem; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); }
  .score-cell.top { border-color: #7c3aed; background: #f5f3ff; }
  @media (prefers-color-scheme: dark) { .score-cell.top { background: #2e1f5e; } }
  .score-em { font-size: 18px; display: block; margin-bottom: 3px; }
  .score-n { font-size: 10px; color: var(--text2); display: block; margin-bottom: 4px; }
  .score-track { height: 3px; background: var(--surface2); border-radius: 2px; margin: 4px 8px; overflow: hidden; }
  .score-bar2 { height: 100%; border-radius: 2px; }
  .score-pct { font-size: 11px; font-weight: 500; color: var(--text); margin-top: 3px; display: block; }

  .pentagon-center { display: flex; justify-content: center; margin: 0.5rem 0; }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin: 1.25rem 0 0; border-bottom: 0.5px solid var(--border); overflow-x: auto; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 0.55rem 0.8rem;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }

  .tab-panel { display: none; padding: 1rem 0; }
  .tab-panel.active { display: block; }

  /* Content styles */
  .section { margin-bottom: 1.25rem; }
  .section-label { font-size: 10px; letter-spacing: 0.1em; color: var(--text3); text-transform: uppercase; margin-bottom: 0.5rem; }
  .section-text { font-size: 13px; color: var(--text); line-height: 1.7; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.4rem; }
  .tag { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--surface2); color: var(--text2); }
  .tag-warn { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .tag-good { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
  @media (prefers-color-scheme: dark) {
    .tag-warn { background: #3d2800; color: #fcd34d; border-color: #92400e; }
    .tag-good { background: #052e16; color: #6ee7b7; border-color: #065f46; }
  }

  .practice-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 1rem 1.1rem; margin-bottom: 0.75rem; }
  .practice-title { font-size: 13px; font-weight: 500; margin-bottom: 0.3rem; }
  .practice-desc { font-size: 12px; color: var(--text2); line-height: 1.65; }

  /* Goodness panel */
  .goodness-intro { background: linear-gradient(135deg, #fdf6ff, #f0fdf4); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  @media (prefers-color-scheme: dark) { .goodness-intro { background: linear-gradient(135deg, #1e1535, #0f2018); } }
  .goodness-intro-title { font-size: 13px; font-weight: 500; margin-bottom: 0.3rem; }
  .goodness-intro-text { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .goodness-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 1rem 1.1rem; margin-bottom: 0.75rem; position: relative; overflow: hidden; }
  .goodness-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .goodness-item.luck::before { background: #f59e0b; }
  .goodness-item.deed::before { background: #10b981; }
  .goodness-item.avoid::before { background: #ef4444; }
  .goodness-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 20px; margin-bottom: 0.4rem; font-weight: 500; }
  .badge-luck { background: #fef3c7; color: #92400e; }
  .badge-deed { background: #d1fae5; color: #065f46; }
  .badge-avoid { background: #fee2e2; color: #991b1b; }
  @media (prefers-color-scheme: dark) {
    .badge-luck { background: #3d2800; color: #fcd34d; }
    .badge-deed { background: #052e16; color: #6ee7b7; }
    .badge-avoid { background: #3d0a0a; color: #fca5a5; }
  }
  .goodness-title { font-size: 13px; font-weight: 500; margin-bottom: 0.3rem; }
  .goodness-desc { font-size: 12px; color: var(--text2); line-height: 1.65; }

  /* Registration form */
  .reg-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
  .reg-title { font-size: 16px; font-weight: 600; margin-bottom: 0.3rem; }
  .reg-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.25rem; line-height: 1.6; }
  .form-group { margin-bottom: 0.9rem; }
  .form-label { font-size: 12px; color: var(--text2); margin-bottom: 0.3rem; display: block; }
  .form-label span { color: #ef4444; margin-left: 2px; }
  .form-input { width: 100%; padding: 0.6rem 0.85rem; font-size: 14px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text); outline: none; transition: border-color 0.15s; }
  .form-input:focus { border-color: var(--accent); background: var(--surface); }
  .form-input.error { border-color: #ef4444; }
  .form-err { font-size: 11px; color: #ef4444; margin-top: 3px; display: none; }
  .privacy-note { font-size: 11px; color: var(--text3); margin-top: 1rem; line-height: 1.6; text-align: center; }

  /* Lucky index */
  .lucky-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 1rem 0 0.5rem; }
  .lucky-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; text-align: center; }
  .lucky-card.highlight { background: linear-gradient(135deg, #fdf6ff, #fefce8); border-color: #c4b5fd; }
  @media (prefers-color-scheme: dark) { .lucky-card.highlight { background: linear-gradient(135deg, #1e1535, #1c1a00); border-color: #7c3aed; } }
  .lucky-label { font-size: 10px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.4rem; }
  .lucky-score { font-size: 28px; font-weight: 700; line-height: 1; }
  .lucky-score.gold { color: #d97706; }
  .lucky-score.purple { color: #7c3aed; }
  .lucky-desc { font-size: 11px; color: var(--text2); margin-top: 0.3rem; line-height: 1.4; }
  .lucky-bar-wrap { margin-top: 6px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .lucky-bar-fill { height: 100%; border-radius: 2px; transition: width 1s ease; }

  /* Paywall */
  .goodness-preview { max-height: 65px; overflow: hidden; position: relative; margin-bottom: 0; }
  .goodness-preview::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
  .paywall-gate { background: var(--surface); border: 0.5px solid #c4b5fd; border-radius: var(--radius-sm); padding: 1.1rem 1.25rem; text-align: center; margin-bottom: 0.75rem; }
  .paywall-icon { font-size: 22px; margin-bottom: 0.4rem; }
  .paywall-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 0.25rem; }
  .paywall-sub { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 0.75rem; }
  .btn-consult { background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; border: none; border-radius: var(--radius-sm); padding: 0.6rem 1.5rem; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-block; }
  .btn-consult:hover { opacity: 0.9; }

  .restart-section { text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 0.5px solid var(--border); }
  .footer { text-align: center; margin-top: 3rem; font-size: 11px; color: var(--text3); }
</style>
</head>
<body>
<div class="app">

  <div class="site-header">
    <div class="brand">五行能量系統</div>
  </div>

  <!-- Phase 0: Welcome -->
  <div class="phase active" id="ph-0">
    <div class="hero">
      <div class="hero-symbol">
        <svg width="130" height="130" viewBox="0 0 130 130">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <polygon points="65,12 92,42 82,76 48,76 38,42" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
          <circle cx="65" cy="65" r="30" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5"/>
          <circle cx="65" cy="65" r="6" fill="#7c3aed" opacity="0.15"/>
          <!-- Labels -->
          <text x="65" y="8" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="600">火</text>
          <text x="103" y="60" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="600">土</text>
          <text x="88" y="97" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="600">金</text>
          <text x="42" y="97" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="600">水</text>
          <text x="27" y="60" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="600">木</text>
          <!-- Center -->
          <text x="65" y="70" text-anchor="middle" fill="#7c3aed" font-size="10" opacity="0.6">五行</text>
        </svg>
      </div>
      <h1>五行能量測試</h1>
      <p>透過 20 道問題，探索你的五行能量分布<br>了解你的特質、健康、人際與命運走向</p>
      <div class="hero-stats">
        <div class="stat"><div class="stat-num">20</div><div class="stat-label">道題目</div></div>
        <div class="stat"><div class="stat-num">5</div><div class="stat-label">大面向分析</div></div>
        <div class="stat"><div class="stat-num">★</div><div class="stat-label">行善提升貴人運</div></div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">開始測試</button>
  </div>

  <!-- Phase 0.5: Registration -->
  <div class="phase" id="ph-reg">
    <div class="reg-card">
      <div class="reg-title">📋 填寫基本資料</div>
      <div class="reg-sub">請填寫以下資料，以便老師後續為你提供個人化諮詢。</div>
      <div class="form-group">
        <label class="form-label">全名<span>*</span></label>
        <input class="form-input" id="f-name" type="text" placeholder="請輸入你的全名" />
        <div class="form-err" id="e-name">請填寫姓名</div>
      </div>
      <div class="form-group">
        <label class="form-label">Email<span>*</span></label>
        <input class="form-input" id="f-email" type="email" placeholder="example@email.com" />
        <div class="form-err" id="e-email">請填寫有效的 Email</div>
      </div>
      <div class="form-group">
        <label class="form-label">電話<span>*</span></label>
        <input class="form-input" id="f-phone" type="tel" placeholder="09xx-xxx-xxx" />
        <div class="form-err" id="e-phone">請填寫電話號碼</div>
      </div>
      <div class="form-group">
        <label class="form-label">Line ID</label>
        <input class="form-input" id="f-line" type="text" placeholder="你的 Line ID（選填）" />
      </div>
      <div class="privacy-note">🔒 資料僅供老師諮詢使用，不對外公開</div>
    </div>
    <button class="btn btn-primary" onclick="submitReg()">填寫完成，開始測試 →</button>
  </div>

  <!-- Phase 1: Quiz -->
  <div class="phase" id="ph-1">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="q-label">第 1 題</span>
        <span id="q-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    </div>
    <div id="q-container"></div>
    <div class="nav-row">
      <button class="btn btn-outline" id="btn-prev" onclick="prevQ()" disabled>← 上一題</button>
      <button class="btn btn-primary btn-next" id="btn-next" onclick="nextQ()" disabled>下一題 →</button>
    </div>
  </div>

  <!-- Phase 2: Results -->
  <div class="phase" id="ph-2">
    <div class="result-hero">
      <span class="result-icon" id="res-icon"></span>
      <div class="result-name" id="res-name"></div>
      <div class="result-sub" id="res-sub"></div>
    </div>

    <div class="scores-row" id="scores-row"></div>
    <div class="lucky-row" id="lucky-row"></div>
    <div class="pentagon-center" id="pentagon"></div>

    <div class="tabs" id="tabs">
      <button class="tab active" onclick="switchTab(0)">特質</button>
      <button class="tab" onclick="switchTab(1)">健康</button>
      <button class="tab" onclick="switchTab(2)">人際&amp;命運</button>
      <button class="tab" onclick="switchTab(3)">練習</button>
      <button class="tab" onclick="switchTab(4)">行善&amp;貴人運</button>
    </div>

    <div class="tab-panel active" id="tp-0"></div>
    <div class="tab-panel" id="tp-1"></div>
    <div class="tab-panel" id="tp-2"></div>
    <div class="tab-panel" id="tp-3"></div>
    <div class="tab-panel" id="tp-4"></div>

    <div class="restart-section">
      <button class="btn btn-outline" onclick="restart()">重新測試</button>
    </div>
  </div>

</div>

<div class="footer">五行能量測試系統 &copy; 2025</div>

<script>
const Q = [
  { q: "你在面對壓力時，通常會？", opts: ["立刻行動，想辦法解決","靈活變通，找替代方案","深思熟慮，反覆分析","尋求支持，照顧情緒","穩步計畫，按部就班"], el: [0,1,2,3,4] },
  { q: "你的溝通風格比較偏向？", opts: ["直接、有力、主導對話","熱情、有感染力、擅長說服","冷靜、邏輯清晰、重細節","溫柔、感同身受、傾聽為主","謹慎、踏實、重視規則"], el: [0,1,2,3,4] },
  { q: "你對「計畫」的態度是？", opts: ["計畫趕不上變化，隨機應變","計畫太死板，喜歡開創可能性","必須有完整計畫才行動","計畫中要考慮所有人的感受","計畫就是要嚴格執行"], el: [0,1,2,3,4] },
  { q: "在人際關係中，你通常扮演？", opts: ["領袖、決策者","啟發者、氣氛製造者","智囊、問題分析者","協調者、情緒支柱","穩定者、可靠後盾"], el: [0,1,2,3,4] },
  { q: "你最容易感到不舒服的情況是？", opts: ["被限制、被控制","無聊、一成不變","混亂、缺乏邏輯","被忽視、孤立無援","不確定性、沒有保障"], el: [0,1,2,3,4] },
  { q: "你的身體比較容易出現哪類問題？", opts: ["肌肉緊繃、頭痛、血壓問題","心臟、血液循環、失眠","呼吸系統、皮膚、過敏","腎臟、腰痛、耳鳴","腸胃、消化、脾胃虛弱"], el: [0,1,2,3,4] },

const EL_NAMES = ["木","火","金","水","土"];
let answers = new Array(Q.length).fill(null);
let cur = 0;
let domIdx = 0;
let finalScores = [];
let userData = {};

function showPhase(id) {
  document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function startQuiz() { showPhase('ph-reg'); }
function restart() { userData={}; answers=new Array(Q.length).fill(null); cur=0; showPhase('ph-0'); }

function submitReg() {
  const name = document.getElementById('f-name').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const line = document.getElementById('f-line').value.trim();
  let ok = true;
  const showErr = (id, show) => { document.getElementById(id).style.display = show ? 'block' : 'none'; };
  const markErr = (id, hasErr) => { document.getElementById(id).classList.toggle('error', hasErr); };
  if (!name) { showErr('e-name',true); markErr('f-name',true); ok=false; } else { showErr('e-name',false); markErr('f-name',false); }
  if (!email || !email.includes('@')) { showErr('e-email',true); markErr('f-email',true); ok=false; } else { showErr('e-email',false); markErr('f-email',false); }
  if (!phone) { showErr('e-phone',true); markErr('f-phone',true); ok=false; } else { showErr('e-phone',false); markErr('f-phone',false); }
  if (!ok) return;
  userData = { name, email, phone, line };
  cur=0; answers=new Array(Q.length).fill(null);
  showPhase('ph-1'); renderQ();
}

function calcLuckyIndex(s, di) {
  const total = s.reduce((a,b)=>a+b,0)||1;
  const balance = 100 - Math.round((Math.max(...s)-Math.min(...s))/total*100)*1.8;
  // Harmony score: how well-rounded the distribution is
  const avg = total/5;
  const variance = s.reduce((a,v)=>a+Math.pow(v-avg,2),0)/5;
  const harmony = Math.max(0, Math.round(100 - variance*8));
  // Lucky index: weighted combo
  const dominant = s[di]/total;
  const luckyBase = Math.round(harmony*0.45 + Math.min(balance,100)*0.35 + (1-dominant)*100*0.2);
  return { lucky: Math.min(98, Math.max(42, luckyBase)), harmony: Math.min(99, Math.max(38, harmony)) };
}

function renderQ() {
  const q = Q[cur];
  const pct = Math.round((cur/Q.length)*100);
  document.getElementById('prog').style.width = pct+'%';
  document.getElementById('q-label').textContent = `第 ${cur+1} / ${Q.length} 題`;
  document.getElementById('q-pct').textContent = pct+'%';
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = answers[cur]===null;
  document.getElementById('btn-next').textContent = cur===Q.length-1 ? '查看結果 →' : '下一題 →';

  document.getElementById('q-container').innerHTML = `
    <div class="q-card">
      <div class="q-text">${q.q}</div>
      <div class="q-options">
        ${q.opts.map((o,i)=>`
          <button class="q-opt ${answers[cur]===i?'selected':''}" onclick="pick(${i})">
            <span class="el-badge">${EL_NAMES[q.el[i]]}</span>${o}
          </button>`).join('')}
      </div>
    </div>`;
}

function pick(i) { answers[cur]=i; document.getElementById('btn-next').disabled=false; renderQ(); }
function prevQ() { if(cur>0){cur--;renderQ();} }
function nextQ() { if(cur<Q.length-1){cur++;renderQ();}else showResults(); }

function showResults() {
  const s=[0,0,0,0,0];
  Q.forEach((q,qi)=>{ if(answers[qi]!==null) s[q.el[answers[qi]]]++; });
  finalScores = s;
  domIdx = s.indexOf(Math.max(...s));
  const el = EL[domIdx];

  document.getElementById('res-icon').textContent = el.icon;
  document.getElementById('res-name').textContent = el.title;
  document.getElementById('res-sub').textContent = el.sub;

  // Five-element scores
  const total = Q.length;
  document.getElementById('scores-row').innerHTML = EL.map((e,i)=>{
    const pct = Math.round((s[i]/total)*100);
    return `<div class="score-cell ${i===domIdx?'top':''}">
      <span class="score-em">${e.icon}</span>
      <span class="score-n">${e.name}</span>
      <div class="score-track"><div class="score-bar2" style="width:${pct}%;background:${e.color}"></div></div>
      <span class="score-pct">${pct}%</span>
    </div>`;
  }).join('');

  // Lucky index
  const { lucky, harmony } = calcLuckyIndex(s, domIdx);
  const luckyLevel = lucky>=80?'極強':lucky>=65?'偏強':lucky>=50?'中等':lucky>=38?'偏弱':'待強化';
  const harmonyLevel = harmony>=80?'高度平衡':harmony>=60?'尚可':harmony>=40?'略有失衡':'明顯失衡';
  document.getElementById('lucky-row').innerHTML = `
    <div class="lucky-card highlight">

      <div class="lucky-bar-wrap"><div class="lucky-bar-fill" style="width:${lucky}%;background:linear-gradient(90deg,#7c3aed,#a855f7)"></div></div>

    </div>

      <div class="lucky-label">☯ 五行平衡指數</div>
      <div class="lucky-score gold">${harmony}</div>
      <div class="lucky-bar-wrap"><div class="lucky-bar-fill" style="width:${harmony}%;background:linear-gradient(90deg,#d97706,#fbbf24)"></div></div>
      <div class="lucky-desc">${harmonyLevel}</div>
    </div>`;

  renderPentagon(s);
  renderContent(domIdx, s);
  showPhase('ph-2');
  switchTab(0);
  sendToGoogleSheet(s, lucky, harmony);

function renderPentagon(s) {
  const total = s.reduce((a,b)=>a+b,0)||1;
  const cx=110,cy=105,r=80,ri=12;
  const ang = [-90,-18,54,126,198].map(d=>d*Math.PI/180);
  const outer = ang.map(a=>[cx+r*Math.cos(a), cy+r*Math.sin(a)]);
  const inner = ang.map((a,i)=>{
    const f = ri + (r-ri)*Math.min(s[i]/(total/5*2),1);
    return [cx+f*Math.cos(a), cy+f*Math.sin(a)];
  });
  const lbl = ang.map(a=>[cx+(r+18)*Math.cos(a), cy+(r+18)*Math.sin(a)]);
  const labels = ["木🌿","火🔥","金⚔️","水💧","土🌍"];
  const colors = EL.map(e=>e.color);

  document.getElementById('pentagon').innerHTML = `
    <svg width="220" height="210" viewBox="0 0 220 210">
      <polygon points="${outer.map(p=>p.join(',')).join(' ')}" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
      ${[.33,.66].map(f=>{
        const pts=ang.map(a=>[cx+r*f*Math.cos(a),cy+r*f*Math.sin(a)]).map(p=>p.join(',')).join(' ');
        return `<polygon points="${pts}" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>`;
      }).join('')}
      ${ang.map(a=>`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="rgba(0,0,0,0.07)" stroke-width="0.5"/>`).join('')}
      <polygon points="${inner.map(p=>p.join(',')).join(' ')}" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
      ${inner.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${colors[i]}"/>`).join('')}
      ${lbl.map((p,i)=>`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#888">${labels[i]}</text>`).join('')}
    </svg>`;
}

// ── Google Sheet 傳送 ──────────────────────────────
// 請將下方 SHEET_URL 換成你的 Google Apps Script 網址
const SHEET_URL = 'https://script.google.com/macros/s/ABC123.../exec';

async function sendToGoogleSheet(scores, luckyIdx, harmonyIdx) {
  if (!SHEET_URL || SHEET_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL') return;
  const el = EL[domIdx];
  const total = Q.length;
  const payload = {
    timestamp: new Date().toLocaleString('zh-TW', {timeZone:'Asia/Taipei'}),
    name: userData.name || '',
    email: userData.email || '',
    phone: userData.phone || '',
    line: userData.line || '',
    mainElement: el.name,
    elementTitle: el.title,
    木: Math.round(scores[0]/total*100),
    火: Math.round(scores[1]/total*100),
    金: Math.round(scores[2]/total*100),
    水: Math.round(scores[3]/total*100),
    土: Math.round(scores[4]/total*100),
    貴人指數: luckyIdx,
    五行平衡指數: harmonyIdx,
    ...Object.fromEntries(Q.map((q,i) => [`Q${i+1}`, answers[i]!==null ? q.opts[answers[i]] : '']))
  };
  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch(e) { console.log('Sheet error:', e); }
}

function switchTab(n) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  document.querySelectorAll('.tab-panel').forEach((t,i)=>t.classList.toggle('active',i===n));
}
